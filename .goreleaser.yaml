version: 2
project_name: mac-cleaner
# DMG packaging requires GoReleaser Pro. CI uses scripts/build-release.sh instead.
before:
  hooks:
    - go mod tidy
    - cd frontend && npm install && npm run build
builds:
  - id: mac-cleaner
    main: .
    binary: mac-cleaner
    env:
      - CGO_ENABLED=1
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    hooks:
      post: |
        test -n "$MACOS_SIGN_IDENTITY" && codesign --deep --force --options runtime --sign "$MACOS_SIGN_IDENTITY" "{{ .Path }}"
archives:
  - format: dmg
    name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}-{{ .Arch }}"
    files:
      - README.md
